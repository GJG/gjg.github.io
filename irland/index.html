<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hiking in Bré 5. juni 2025</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .slideshow-container {
            position: relative;
            max-width: 90vw;
            width: 100%;
            max-height: 80vh;
            margin: 40px auto 20px auto;
            overflow: hidden;
            background: #111;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0;
        }
        .controls button {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .controls button:hover {
            background: #666;
        }
        @media (max-width: 600px) {
            .slideshow-container {
                max-width: 100vw;
                max-height: 50vh;
            }
            .slide img {
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>
    <h1>Hiking in BRÉ, 5th of juni, 2025</h1>
    <div class="slideshow-container" id="slideshow"></div>
    <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="pauseBtn">Pause</button>
        <button id="nextBtn">Next</button>
    </div>
    <p style="color: #ccc; text-align: center;">Click on an image to view it in high resolution.</p>
    <audio src="audio/bgmusic.mp3" autoplay loop controls></audio>
    <p>This is my first sound mix I have done in Suno, enjoy or turn  it off ;)</p>
<script>
const images = [
    "IMG_9411_resized.jpg",
    "IMG_9412_resized.jpg",
    "IMG_9413_resized.jpg",
    "IMG_9415_resized.jpg",
    "IMG_9416_resized.jpg",
    "IMG_9417_resized.jpg",
    "IMG_9418_resized.jpg",
    "IMG_9419_resized.jpg",
    "IMG_9420_resized.jpg",
    "IMG_9421_resized.jpg",
    "IMG_9423_resized.jpg",
    "IMG_9424_resized.jpg",
    "IMG_9425_resized.jpg",
    "IMG_9427_resized.jpg",
    "IMG_9429_resized.jpg",
    "IMG_9430_resized.jpg",
    "IMG_9431_resized.jpg",
    "IMG_9432_resized.jpg",
    "IMG_9433_resized.jpg",
    "MQDQ8082_resized.jpg"
];

const slideshow = document.getElementById('slideshow');
let current = 0;
let interval = null;
let paused = false;

function getHighResName(resizedName) {
    return "bre-originals/" + resizedName.replace("_resized", "");
}

function showSlide(idx) {
    slideshow.innerHTML = '';
    const slide = document.createElement('div');
    slide.className = 'slide';
    const link = document.createElement('a');
    link.href = getHighResName(images[idx]);
    link.target = "_blank";
    link.rel = "noopener";
    // Optional: Uncomment the next line to force download instead of open in browser
    // link.download = getHighResName(images[idx]);
    const image = document.createElement('img');
    image.src = images[idx];
    image.alt = `Irland image ${idx+1}`;
    link.appendChild(image);
    slide.appendChild(link);
    slideshow.appendChild(slide);
}

function nextSlide() {
    current = (current + 1) % images.length;
    showSlide(current);
}

function prevSlide() {
    current = (current - 1 + images.length) % images.length;
    showSlide(current);
}

function startSlideshow() {
    interval = setInterval(() => {
        if (!paused) nextSlide();
    }, 5000);
}

function pauseSlideshow() {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'Play' : 'Pause';
}

document.getElementById('nextBtn').onclick = () => {
    nextSlide();
};
document.getElementById('prevBtn').onclick = () => {
    prevSlide();
};
document.getElementById('pauseBtn').onclick = () => {
    pauseSlideshow();
};

if (images.length > 0) {
    showSlide(current);
    startSlideshow();
} else {
    slideshow.innerHTML = "<p style='color:#fff;text-align:center;'>No images found. Please edit the <code>images</code> array in the HTML file.</p>";
}
</script>
</body>
</html>
